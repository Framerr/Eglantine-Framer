name: fork-preflight

# Fast, read-only validation. The full emulator build and release are handled by ci.yml.
on:
  push:
    branches: [nx2]
  pull_request:
    branches: [nx2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release metadata and helper scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate CI helper shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in tools/ci/*.sh; do
            bash -n "$script"
          done

      - name: Validate version and release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$'
          [[ "$version" =~ $regex ]] || { echo "Invalid VERSION: $version"; exit 1; }
          core="${version%%-rc*}"
          section=$(bash tools/ci/changelog-section.sh "$core")
          [[ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]] || {
            echo "Empty release notes for $core"
            exit 1
          }

      - name: Validate Pokopia test documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/POKOPIA_TESTING.md
          test -s .github/ISSUE_TEMPLATE/pokopia_bug.yml
